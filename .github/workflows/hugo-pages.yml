# Generated by prepare_github_pages.py 3.1
name: Deploy Hugo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install Hugo and Sass
        env:
          HUGO_VERSION: '0.167.0'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/hugo" "$RUNNER_TEMP/sass"
          curl -fL --retry 3 "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar -xz -C "$RUNNER_TEMP/hugo"
          curl -fL --retry 3 "https://github.com/sass/dart-sass/releases/download/1.105.0/dart-sass-1.105.0-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/sass"
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/sass/dart-sass" >> "$GITHUB_PATH"
          echo "HUGO_CACHEDIR=$RUNNER_TEMP/hugo-cache" >> "$GITHUB_ENV"
      - name: Prepare dependencies
        run: python .github/pages_build.py --dependencies
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build and fix project URL paths
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # 푸터의 '배포 버전'에 표시할 커밋(site/layouts/_partials/footer.html)
          HUGO_PARAMS_DEPLOYSHA: ${{ github.sha }}
        run: python .github/pages_build.py --build
      - name: Test site checker
        run: python -m unittest discover -s verification -p 'test_*.py' -v
      - name: Check generated site before publication
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python verification/check_site.py public --base-url "${SITE_BASE_URL%/}/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
