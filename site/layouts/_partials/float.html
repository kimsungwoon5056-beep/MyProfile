{{ if not .Site.Params.hideColorSchemeToggle }}
<div class="float-container">
  <button type="button" id="dark-mode-toggle" class="colorscheme-toggle" aria-label="밝은 화면과 어두운 화면 전환" title="밝은 화면과 어두운 화면 전환">
    <i class="fa-solid fa-adjust fa-fw" aria-hidden="true"></i>
  </button>
</div>
{{ end }}
